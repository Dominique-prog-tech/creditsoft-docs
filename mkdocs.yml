site_name: CreditSoft Documentatie
site_description: Officiële handleiding voor CreditSoft
site_author: Dominique
site_url: https://docs.creditsoft.be/
copyright: >
  CreditSoft &copy; 2026 — eigendom van
  <a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
  Alle rechten voorbehouden.

theme:
  name: material
  language: nl
  logo: images/logo.svg
  favicon: images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Schakel naar donkere modus
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Schakel naar lichte modus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/embed.css

extra_javascript:
  - javascripts/embed.js
  # Plausible Analytics — cookieloos, geen persoonsgegevens, EU-hosting; dus
  # geen toestemmingsbanner nodig. Via extra_javascript belandt dit in ELKE
  # gegenereerde pagina, ook in pagina's die er later bij komen.
  - https://plausible.io/js/pa-v61a-O_ctqLqhyQttSSLc.js
  - javascripts/plausible-init.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  # Iconen (:material-…: / :octicons-…:) voor het kaartraster op de onthaalpagina.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - nl
        - fr
  # Klik op een schermafbeelding = schermvullend openen, met zoom en pijltjes tussen de beelden van
  # dezelfde pagina. Nodig omdat een bewerkscherm van 2560 px breed in een tekstkolom van ~830 px
  # onleesbaar klein wordt. Staat vóór `i18n`: die plugin bouwt per taal een aparte pagina, en glightbox
  # moet op elke gebouwde pagina passeren.
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      # Alleen echte schermafbeeldingen, geen emoji-iconen en geen logo in de kopbalk.
      skip_classes:
        - twemoji
        - emojione
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nl
          default: true
          name: Nederlands
          build: true
          site_name: CreditSoft Documentatie
          site_description: Officiële handleiding voor CreditSoft
        - locale: fr
          name: Français
          build: true
          site_name: CreditSoft Documentation
          site_description: Manuel officiel de CreditSoft
          copyright: >
            CreditSoft &copy; 2026 — propriété d'<a href="https://www.adm-concept.be" target="_blank" rel="noopener">ADM-Concept</a>.
            Tous droits réservés.
          theme:
            language: fr
            palette:
              - scheme: default
                primary: white
                accent: indigo
                toggle:
                  icon: material/brightness-7
                  name: Passer en mode sombre
              - scheme: slate
                primary: black
                accent: indigo
                toggle:
                  icon: material/brightness-4
                  name: Passer en mode clair
          nav_translations:
            # Eén regel per nav-item, niet meer. Deze tabel telde ooit 108 regels
            # voor 51 menu-items: resten van de oude mappenstructuur
            # (credit-files/, settings/, work/, account/) die in juli 2026
            # vervangen is. mkdocs negeert wat het niet tegenkomt, dus het viel
            # nooit op — maar wie een vertaling toevoegde zocht in een lijst
            # waarvan de helft ruis was, en zag daardoor "Contracten overzicht"
            # over het hoofd toen "Contractenoverzicht" nodig was.
            Home: Accueil
            Aan de slag: Premiers pas
            Navigeren in CreditSoft: Naviguer dans CreditSoft
            Tweestapsverificatie (2FA): Vérification en deux étapes (2FA)
            Kredieten: Crédits
            Lijsten: Listes
            Relatiebeheer: Gestion des relations
            Professionals: Professionnels
            Groepen: Groupes
            # Deze zes ontbraken (gemeten 26/08/2026): het hele aanbrengersportaal-hoofdstuk kwam erbij
            # zonder vertalingen, waardoor "Aanbrengersportaal" onvertaald tussen zeven Franse tabbladen
            # bovenaan stond. De Franse termen zijn overgenomen uit de APP zelf, niet zelf verzonnen —
            # handleiding en scherm horen hetzelfde te zeggen.
            Leads: Leads
            Aanbrengersportaal: Portail apporteurs
            Het aanbrengersportaal: Le portail apporteurs
            Overzicht: Aperçu
            Mijn dossiers: Mes dossiers
            Mijn commissies: Mes commissions
            # "Beheer" stond hier ook, met vertaling "Gestion", én verderop met
            # "Configuration". YAML slikt een dubbele sleutel zonder waarschuwing en
            # de laatste wint — dus "Gestion" deed niets. Hier weggehaald; de
            # overgebleven "Beheer: Configuration" verderop is de werkende.
            Bedrijfsfiche: Fiche d'entreprise
            Gebruikers: Utilisateurs
            Mailsjablonen: Modèles d'e-mail
            Mailmonitoring: Suivi des e-mails
            Rollen: Rôles
            Verzendadressen: Adresses d'envoi
            Prullenbak: Corbeille
            Actielogboek: Journal d'activité
            # Ontbraken en verschenen onvertaald in de Franse navigatie (14/08/2026).
            Het dashboard: Le tableau de bord
            Globaal overzicht: Aperçu global
            Verzekeringen: Assurances
            Leads vanaf uw website: Leads depuis votre site web
            Relaties: Relations
            Aanbrengers: Apporteurs
            Afspraken: Rendez-vous
            Online afspraken: Rendez-vous en ligne
            Borderel: Bordereau
            Commissie-instellingen: Paramètres de commission
            Commissieschema's: Schémas de commission
            Vooruitzicht: Perspective
            Restanten commissie: Reliquats de commission
            Dashboard-fases: Phases du tableau de bord
            Uw publieke pagina's: Vos pages publiques
            Verlof & sluitingsdagen: Congés & jours de fermeture
            Instellingen: Paramètres
            Keuzelijsten: Listes de choix
            Documenttypes: Types de documents
            Uw voorkeuren: Vos préférences
            Mijn gegevens: Mes données
            Wachtwoord wijzigen: Changer le mot de passe
            # Bijgekomen 16/08/2026 met het journaal-luik en de nav-regel voor "Werken met lijsten".
            Werken met lijsten: Travailler avec les listes
            Journaal: Journal
            Het journaal: Le journal
            Notities: Notes
            Gesprekken: Appels
            Bijlagen: Pièces jointes
            Mailverkeer: Courrier
            # "Historique" en niet "Journal": de lade heet in het Frans al Journal. In het Nederlands
            # speelt dat niet — daar staat Logboek in de lade Journaal. Ook zo in de toepassing zelf.
            Logboek: Historique
            Kredietdossiers: Dossiers de crédit
            Te valideren documenten: Documents à valider
            # Het nav-item heet Contractenoverzicht (één woord); zonder deze regel bleef het onvertaald
            # in de Franse navigatie staan. Gezien 18/08/2026.
            Contractenoverzicht: Aperçu des contrats
            # Ontbraken en stonden onvertaald in het Franse menu, terwijl de pagina's
            # zelf wél Frans zijn: je klikte op "Klantenportaal" en belandde op
            # "Portail client". Gezien 21/08/2026 op de live site.
            Filteren en zoeken in lijsten: Filtrer et rechercher dans les listes
            Klantenportaal: Portail client
            Rapporten: Rapports
            Kredietinstellingen: Institutions de crédit
            Verzekeraars: Assureurs
            Schattingen: Estimations
            Taken: Tâches
            Beheer: Configuration

extra:
  generator: false

nav:
  - Home: index.md

  - Aan de slag:
    - Navigeren in CreditSoft: getting-started/navigatie.md
    - Zoeken vanaf elk scherm: getting-started/zoeken.md
    # Stond tot 16/08/2026 wél op de schijf maar niet hier: de pagina was enkel te bereiken via een
    # link ín een andere pagina, niet via het menu. Met een expliciete nav toont mkdocs enkel wat
    # hier staat — een bestand toevoegen is dus niet genoeg.
    - Werken met lijsten: getting-started/lijsten.md
    - Het dashboard: getting-started/dashboard.md
    # Het "algemene zaken"-blok (16/08/2026): wat elke gebruiker over zijn eigen account beslist.
    - Uw voorkeuren: getting-started/voorkeuren.md
    - Mijn gegevens: getting-started/mijn-gegevens.md
    - Wachtwoord wijzigen: getting-started/wachtwoord.md
    - Tweestapsverificatie (2FA): getting-started/tweestapsverificatie.md

  # Het journaal hangt aan zes schermen en werkt overal hetzelfde. Daarom één keer beschreven, en
  # vanuit die zes pagina's aangehaald — niet zes keer herhaald en zes keer bij te werken.
  - Journaal:
    - Het journaal: journaal/overzicht.md
    # Staat vooraan omdat hij dat in de toepassing ook doet: bij een relatie is dit het eerste tabblad na de
    # fiche zelf. Enkel op een relatie — zie de opsomming in overzicht.md.
    - Kredietdossiers: journaal/kredietdossiers.md
    - Taken: journaal/taken.md
    - Notities: journaal/notities.md
    - Gesprekken: journaal/gesprekken.md
    - Bijlagen: journaal/bijlagen.md
    - Mailverkeer: journaal/mailverkeer.md
    - Logboek: journaal/logboek.md

  # Groeit mee per gevalideerd scherm — voeg hier telkens één regel toe.
  - Kredieten:
    - Kredietdossiers: credit-management/credit-files.md
    - Te valideren documenten: credit-management/document-validation.md
    - Kredietinstellingen: credit-management/financial-institutions.md
    - Verzekeraars: credit-management/insurance-companies.md
    - Borderel: credit-management/commission-statements.md
    - Fiche 281.50: credit-management/fiche-281-50.md

  - Lijsten:
    # Bovenaan: geldt voor élke lijst, dus lees je die eerst. De schermpagina's verwijzen ernaar
    # in plaats van de uitleg te herhalen.
    - Filteren en zoeken in lijsten: credit-management/filteren-in-lijsten.md
    - Taken: credit-management/tasks.md
    - Globaal overzicht: credit-management/global-overview.md
    - Schattingen: credit-management/appraisals.md
    - Verzekeringen: credit-management/insurance-contracts.md
    - Contractenoverzicht: credit-management/contract-overview.md
    - Rapporten: credit-management/reports.md
    - Documentbibliotheek: credit-management/document-library.md
    - Commissieschema's: credit-management/commission-schemes.md
    - Vooruitzicht: credit-management/commission-forecast.md

  - Relatiebeheer:
    - Leads: crm/leads.md
    - Leads vanaf uw website: crm/leads-webformulier.md
    - Relaties: crm/relations.md
    - Professionals: crm/professionals.md
    - Aanbrengers: crm/contributors.md
    - Afspraken: crm/meetings.md
    - Online afspraken: crm/online-afspraken.md
    - Groepen: crm/groups.md

  # Het aanbrengersportaal (23/08/2026). Eigen hoofdstuk en niet onder Relatiebeheer: die pagina's gaan over
  # wat de MAKELAAR met een aanbrenger doet, deze over wat de AANBRENGER zelf ziet. Twee lezers, twee plekken.
  - Aanbrengersportaal:
    - Het aanbrengersportaal: portaal/index.md
    - Overzicht: portaal/overzicht.md
    - Mijn dossiers: portaal/dossiers.md
    - Mijn commissies: portaal/commissies.md

  - Beheer:
    - Bedrijfsfiche: administration/company-profile.md
    - Gebruikers: administration/users.md
    - Mailsjablonen: administration/mail-templates.md
    - Mailmonitoring: administration/mail-monitoring.md
    - Rollen: administration/roles.md
    - Verzendadressen: administration/sender-addresses.md
    - Prullenbak: administration/recycle-bin.md
    - Actielogboek: administration/activity-log.md
    - Commissie-instellingen: beheer/commissie-instellingen.md
    - Restanten commissie: beheer/commissie-restanten.md
    - Dashboard-fases: beheer/dashboard-fases.md
    - Uw publieke pagina's: beheer/kantoorprofiel.md
    - Verlof & sluitingsdagen: beheer/afwezigheden.md
    - Instellingen: beheer/instellingen.md
    - Keuzelijsten: beheer/keuzelijsten.md
    - Documenttypes: beheer/documenttypes.md
    - Klantenportaal: beheer/klantportaal.md
